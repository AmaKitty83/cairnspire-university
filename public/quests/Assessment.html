.bubble b{color:var(--teal2)}

.passage .src{display:block;font-size:13px;color:var(--ink2);margin-top:6px;font-style:italic}
.tag{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;margin:0 6px 6px 0;border:1px solid var(--line);background:#fff8ea}
.tag.calc{background:var(--tealsoft);border-color:var(--teal)}
.opts{display:grid;gap:8px;margin:10px 0}.opts label{display:flex;gap:10px;align-items:flex-start;background:#fffdf6;border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer}
.opts input{margin-top:5px}
input[type=text],textarea{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--gold2);background:#fffdf6;color:var(--ink);width:100%;max-width:340px}
textarea{max-width:100%;min-height:200px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.rule{background:var(--tealsoft);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:15px}
.hidden{display:none!important}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:15px}td,th{border:1px solid var(--line);padding:5px 8px;text-align:left}
.pv h3{margin:16px 0 4px;color:var(--teal2)}.lvl{font-weight:bold}
pre.export{white-space:pre-wrap;background:#fffdf6;border:1px solid var(--line);padding:10px;border-radius:10px;font-size:14px;max-height:340px;overflow:auto}
.modal{position:fixed;inset:0;background:rgba(10,14,15,.7);display:flex;align-items:center;justify-content:center;z-index:9}
.modal .card{max-width:380px}
footer{text-align:center;padding:10px;font-size:13px;color:var(--soft)}
@media(prefers-reduced-motion:no-preference){.card{animation:fade .25s ease}}@keyframes fade{from{opacity:.4}to{opacity:1}}
